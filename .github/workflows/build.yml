name: Build & Release Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install --no-package-lock

      - name: Verify renderer files are present
        shell: bash
        run: |
          echo "--- repo tree ---"
          ls -la src/renderer || true
          test -f src/renderer/index.html || (echo 'index.html missing!' && exit 1)
          test -f src/renderer/styles.css || (echo 'styles.css missing!' && exit 1)
          test -f src/renderer/renderer.js || (echo 'renderer.js missing!' && exit 1)

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect packed asar (Linux only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          npx --yes @electron/asar list dist/linux-unpacked/resources/app.asar || \
          npx --yes asar list dist/linux-unpacked/resources/app.asar || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MultiRP-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
            dist/latest*.yml
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
